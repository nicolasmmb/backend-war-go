x-api-env: &api-env
  PORT: "9999"
  USE_MMAP: "true"
  NPROBE: "8"
  INDEX_PATH: "/resources/index.bin"

x-api: &api
  image: ghcr.io/nicolasmmb/backend-war-go:latest
  platform: linux/amd64
  cpus: "0.42"
  mem_limit: "152m"
  volumes:
    - sockets:/sockets
  networks:
    - rinha-net

services:
  lb:
    image: haproxy:3.0-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    cpus: "0.16"
    mem_limit: "46m"
    networks:
      - rinha-net

  api1:
    <<: *api
    environment:
      <<: *api-env
      UDS_PATH: /sockets/api1.sock
      UDS_MODE: "438"

  api2:
    <<: *api
    environment:
      <<: *api-env
      UDS_PATH: /sockets/api2.sock
      UDS_MODE: "438"

networks:
  rinha-net:
    driver: bridge

volumes:
  sockets:
