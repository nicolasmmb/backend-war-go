global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 2s
  timeout client 5s
  timeout server 5s
  timeout http-request 5s
  timeout http-keep-alive 30s

frontend ingress
  bind :9999
  default_backend fraud_apis

backend fraud_apis
  balance roundrobin
  option httpchk GET /ready
  http-check expect status 200
  server api1 api1:9999 check inter 1s fall 2 rise 1
  server api2 api2:9999 check inter 1s fall 2 rise 1
